# CI gate for pull requests: SwiftLint + REUSE compliance, full builds of
# both variants (catches signing/packaging regressions before merge) and
# the XCTest suite.
#
# PR builds use a synthetic epoch-based version so they never collide
# with real releases; newer pushes cancel the in-flight run.

name: PR Check

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------

  # Swift style check with the project configuration (AdguardMini/.swiftlint.yml).
  swiftlint:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: SwiftLint
    uses: AdGuardSoftwareLimited/actions/.github/workflows/lint-swiftlint.yml@master
    with:
      team: mac
      source-path: AdguardMini

  # SPDX license compliance (REUSE spec, configured in REUSE.toml).
  reuse:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: REUSE Compliance
    uses: AdGuardSoftwareLimited/actions/.github/workflows/lint-reuse.yml@master
    with:
      team: mac

  # ---------------------------------------------------------------------------
  # Build & Test
  # ---------------------------------------------------------------------------

  # Synthetic epoch-based version so PR artifacts never collide with
  # real releases.
  prepare:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Prepare version metadata
    runs-on: [team-mac]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version-title: ${{ steps.meta.outputs.version-title }}
      raw-version: ${{ steps.meta.outputs.raw-version }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/epoch-version-metadata@master
        id: meta

  # The runner image lives in the KV store so it can be rotated without edits.
  resolve-runner:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Resolve runner
    runs-on: [team-mac]
    outputs:
      image: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/macos

  build-standalone-release:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Build Standalone Release
    needs: [prepare]
    uses: ./.github/workflows/build-standalone.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      version-title: ${{ needs.prepare.outputs.version-title }}
      build-number: '${{ github.run_number }}'
      sentry-release: ${{ needs.prepare.outputs.raw-version }}

  build-mas:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Build MAS
    needs: [prepare]
    uses: ./.github/workflows/build-mas.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      version-title: ${{ needs.prepare.outputs.version-title }}
      build-number: '${{ github.run_number }}'
      sentry-release: ${{ needs.prepare.outputs.raw-version }}

  test:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Tests
    needs: [resolve-runner]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/junit-tests.yml@master
    with:
      runs-on: >-
        [
          "ephemeral",
          "ephemeral-mac",
          "${{ needs.resolve-runner.outputs.image }}",
          "ephemeral-limit-memory-7168",
          "ephemeral-limit-cpu-4",
          "ephemeral-limit-disk-gb-20"
        ]
      test-command: >-
        set -o pipefail &&
        mkdir -p ../sciter-adguard-mini-private/configuration &&
        printf 'CONFIG_BACKEND_REQUEST_KEY = dummy_request_key\nCONFIG_BACKEND_REQUEST_ENCRYPTION_KEY = dummy_encryption_key\n'
        > ../sciter-adguard-mini-private/configuration/PrivateConfig.xcconfig &&
        swift package-registry set --global --scope mac ${{ vars.SWIFT_REGISTRY_URL }}-virtual &&
        mkdir -p build/test-reports &&
        xcodebuild test
        -project AdguardMini/AdguardMini.xcodeproj
        -scheme AdguardMiniTests
        -configuration Release
        -derivedDataPath build/derived_data
        -skipPackagePluginValidation
        CODE_SIGNING_ALLOWED=NO
        2>&1 |
        xcbeautify --report junit
        --report-path build/test-reports
        --junit-report-filename AdguardMiniTests.junit
      results-path: build/test-reports/AdguardMiniTests.junit
      artifact-name: test-results
    secrets: inherit

  # ---------------------------------------------------------------------------
  # TypeScript UI lint & node tests
  # ---------------------------------------------------------------------------

  # ESLint gate matching the local pre-commit hook (yarn lint --quiet).
  ts-lint:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: TS lint
    runs-on: [team-sciter]
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint --quiet

  # node:test gate matching the local pre-commit hook (yarn test:node).
  ts-test:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: TS tests
    runs-on: [team-sciter]
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript tests (node:test)
        run: yarn test:node
