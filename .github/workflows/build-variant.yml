# Builds ONE distribution variant end to end: signing setup → archive →
# export → notarize → artifact → Sentry. Version/build/channel inputs
# override the xcconfig placeholders (see "External version management"
# in AGENTS.md).
#
# Called by the build-standalone / build-mas / build-mas-iap wrappers;
# mechanics: docs/production-build-and-deploy.md

name: Build variant

on:
  workflow_call:
    inputs:
      configuration:
        description: "Build configuration (Release, MAS, etc.)"
        type: string
        required: true
      signing-type:
        description: "Match type: developer_id, appstore"
        type: string
        required: true
      additional-cert-types:
        description: "Additional certificate types, comma-separated"
        type: string
        default: ""
      skip-profiles:
        description: "Skip provisioning profiles"
        type: boolean
        default: false
      app-identifiers:
        description: "App bundle identifiers, comma-separated"
        type: string
        required: true
      notarize:
        description: "Whether to notarize the build"
        type: boolean
        required: true
      sentry-release:
        description: "Release identifier for Sentry"
        type: string
        default: ""
      version:
        description: "Version string (e.g. 2.4.0). Overrides AG_VERSION from xcconfig. Uses xcconfig default when empty."
        type: string
        default: ""
      version-title:
        description: "Display version title (e.g. 2.5.0 or 2026.07.21 Build). Overrides AG_VERSION_TITLE from xcconfig. Uses xcconfig default when empty."
        type: string
        default: ""
      build-number:
        description: "Build number (e.g. 1090). Overrides AG_BUILD from xcconfig. Uses xcconfig default when empty."
        type: string
        default: ""
      channel:
        description: "Release channel (release, beta, nightly). Controls AG_CHANNEL and update feed URL."
        type: string
        default: "release"
      app-store-info:
        description: "Generate AppStoreInfo.plist and upload the MAS output directory (for TestFlight deploy). Only applicable to appstore signing."
        type: boolean
        default: false
      xcodebuild-args:
        description: "Additional xcodebuild build settings appended to XCODEBUILD_ARGS (e.g. 'AG_FOO=\"bar\" AG_BAZ=\"qux\"')."
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  resolve-artifact-path:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Resolve artifact path
    runs-on: [team-mac]
    outputs:
      path: ${{ steps.resolve.outputs.path }}
      archive-path: ${{ steps.resolve.outputs.archive-path }}
    env:
      CONFIG: ${{ inputs.configuration }}
      SIGNING_TYPE: ${{ inputs.signing-type }}
    steps:
      - id: resolve
        env:
          APP_STORE_INFO: ${{ inputs.app-store-info }}
        run: |
          output_dir="build/${CONFIG}"
          if [ "${SIGNING_TYPE}" = "appstore" ]; then
            if [ "${APP_STORE_INFO}" = "true" ]; then
              # Keep the whole export dir; the TestFlight deployer finds the
              # .pkg/AppStoreInfo.plist by glob at the top of the artifact.
              echo "path=${output_dir}" >> "$GITHUB_OUTPUT"
            else
              echo "path=${output_dir}/AdGuard Mini.pkg" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "path=${output_dir}/AdGuard Mini.app" >> "$GITHUB_OUTPUT"
          fi
          echo "archive-path=${output_dir}/AdguardMini.xcarchive" >> "$GITHUB_OUTPUT"

  build:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Build ${{ inputs.configuration }}
    needs: [resolve-artifact-path]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/build-macos.yml@master
    secrets: inherit
    with:
      runner-memory-mb: 8192
      channel: ${{ inputs.channel }}
      signing-type: ${{ inputs.signing-type }}
      additional-cert-types: ${{ inputs.additional-cert-types }}
      skip-profiles: ${{ inputs.skip-profiles }}
      app-identifiers: ${{ inputs.app-identifiers }}
      vault-role: appbackend-request-key
      vault-secrets: |
        secret/data/ci-secrets/appbackend-request-key request_encryption_key | CONFIG_BACKEND_REQUEST_ENCRYPTION_KEY;
        secret/data/ci-secrets/appbackend-request-key request_key | CONFIG_BACKEND_REQUEST_KEY
      prepare-script: |
        export SWIFT_REGISTRY_URL=${{ vars.SWIFT_REGISTRY_URL }}-virtual

        # Build xcodebuild CLI build settings to override xcconfig defaults.
        XCODEBUILD_OVERRIDE_ARGS=()
        [ -n "$BUILD_CHANNEL" ] && XCODEBUILD_OVERRIDE_ARGS+=("AG_CHANNEL=$BUILD_CHANNEL")
        [ -n "${{ inputs.version }}" ] && XCODEBUILD_OVERRIDE_ARGS+=("AG_VERSION=${{ inputs.version }}")
        [ -n "${{ inputs.version-title }}" ] && XCODEBUILD_OVERRIDE_ARGS+=("AG_VERSION_TITLE=${{ inputs.version-title }}")
        [ -n "${{ inputs.build-number }}" ] && XCODEBUILD_OVERRIDE_ARGS+=("AG_BUILD=${{ inputs.build-number }}")
        if [ -n "${{ inputs.xcodebuild-args }}" ]; then
          while IFS= read -r arg; do
            XCODEBUILD_OVERRIDE_ARGS+=("$arg")
          done < <(printf '%s' "${{ inputs.xcodebuild-args }}" | xargs printf '%s\n')
        fi
        {
          echo "XCODEBUILD_OVERRIDE_ARGS<<EOF"
          printf '%s\n' "${XCODEBUILD_OVERRIDE_ARGS[@]}"
          echo "EOF"
        } >> "$GITHUB_ENV"

        [ -f .nvmrc ] || { ./configure.sh; exit 0; }
        NODE_REQUIRED=$(sed 's/^v//; s/\..*//' < .nvmrc)
        NODE_CURRENT=$(node --version 2>/dev/null | sed 's/^v//; s/\..*//')
        if [ "${NODE_CURRENT:-0}" -lt "$NODE_REQUIRED" ]; then
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          \. "$NVM_DIR/nvm.sh"
          nvm install "$NODE_REQUIRED"
          nvm use "$NODE_REQUIRED"
          echo "$(nvm which "$NODE_REQUIRED" | xargs dirname)" >> "$GITHUB_PATH"
        fi
        ./configure.sh
      build-command: |
        set -euo pipefail

        CONFIG="${{ inputs.configuration }}"
        PROJECT="AdguardMini/AdguardMini.xcodeproj"
        SCHEME="AdguardMini"
        BUILD_DIR="build"
        OUTPUT_DIR="${BUILD_DIR}/${CONFIG}"
        DERIVED_DATA_DIR="${BUILD_DIR}/derived_data"
        ARCHIVE_PATH="${{ needs.resolve-artifact-path.outputs.archive-path }}"

        # ── Constants ─────────────────────────────────────────────────
        TEAM_ID="TC3Q7MAJXF"

        # ── Export method ─────────────────────────────────────────────
        EXPORT_METHOD="developer-id"
        if [ "${{ inputs.signing-type }}" = "appstore" ]; then
          EXPORT_METHOD="app-store"
        fi

        EXPORT_OPTS="${RUNNER_TEMP}/export_options.plist"

        mkdir -p "${OUTPUT_DIR}" "$(dirname "${ARCHIVE_PATH}")"

        # ── Build ExportOptions.plist ─────────────────────────────────
        /usr/libexec/PlistBuddy \
          -c "Add method string ${EXPORT_METHOD}" \
          -c "Add signingStyle string manual" \
          -c "Add teamID string ${TEAM_ID}" \
          -c "Add manageAppVersionAndBuildNumber bool false" \
          "${EXPORT_OPTS}"

        echo "=== Export options ==="
        /usr/libexec/PlistBuddy -c Print "${EXPORT_OPTS}"

        # ── Add provisioning profiles (unless skipped) ────────────────
        # match appends a dynamic timestamp suffix to profile names; resolve by bundle id.
        if [ "${{ inputs.skip-profiles }}" != "true" ]; then
          /usr/libexec/PlistBuddy -c "Add provisioningProfiles dict" "${EXPORT_OPTS}"
          PP_DIR="${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles"

          # Decode profiles once into a TSV lookup for bundle id resolution.
          PP_LOOKUP="${RUNNER_TEMP}/pp_lookup.tsv" && : > "${PP_LOOKUP}"
          for p in "${PP_DIR}"/*.provisionprofile; do
            plist=$(security cms -D -i "${p}" 2>/dev/null) || continue
            appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" /dev/stdin <<<"${plist}" 2>/dev/null || true)
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<<"${plist}" 2>/dev/null || true)
            [ -n "${appid}" ] && [ -n "${name}" ] && printf '%s\t%s\n' "${appid#*.}" "${name}" >> "${PP_LOOKUP}"
          done
          IFS=',' read -ra IDS <<< "${{ inputs.app-identifiers }}"
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | xargs)
            name=$(grep -F "${id}"$'\t' "${PP_LOOKUP}" | head -1 | cut -f2 || true)
            [ -n "${name}" ] && echo "Using profile '${name}' for ${id}" &&
              /usr/libexec/PlistBuddy -c "Add provisioningProfiles:${id} string ${name}" "${EXPORT_OPTS}"
          done
        fi

        # ── Overrides (set by prepare-script) ─────────────────
        mapfile -t XCODEBUILD_ARGS <<< "$XCODEBUILD_OVERRIDE_ARGS"

        # ── Archive ───────────────────────────────────────────────────
        # Adhoc-sign: real identity requires profiles per target; exportArchive re-signs later.
        xcodebuild archive \
          -project "${PROJECT}" \
          -scheme "${SCHEME}" \
          -configuration "${CONFIG}" \
          -archivePath "${ARCHIVE_PATH}" \
          -derivedDataPath "${DERIVED_DATA_DIR}" \
          -skipPackagePluginValidation \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="" \
          "${XCODEBUILD_ARGS[@]}"

        # ── Add installer cert to export options ─────────────────────
        # Required for PKG signing (separate from app signing).
        if [ -n "${MATCH_KEYCHAIN_NAME:-}" ] && [ -n "${{ inputs.additional-cert-types }}" ]; then
          INST_NAME=$(security find-identity -v "${MATCH_KEYCHAIN_NAME}" \
            | grep -E "Mac Developer Installer|Developer ID Installer" \
            | head -1 | awk -F'"' '{print $2}' || true)
          if [ -n "${INST_NAME}" ]; then
            echo "Setting installerSigningCertificate: ${INST_NAME}"
            /usr/libexec/PlistBuddy -c "Add installerSigningCertificate string ${INST_NAME}" "${EXPORT_OPTS}"
          fi
        fi

        # ── Generate AppStoreInfo.plist for TestFlight ────────────
        # Required by deploy-to-testflight.yml for App Store Connect upload.
        if [ "${EXPORT_METHOD}" = "app-store" ] && [ "${{ inputs.app-store-info }}" = "true" ]; then
          /usr/libexec/PlistBuddy -c "Add generateAppStoreInformation bool true" "${EXPORT_OPTS}"
        fi

        # ── Export .app ───────────────────────────────────────────────
        xcodebuild -exportArchive \
          -archivePath "${ARCHIVE_PATH}" \
          -exportPath "${OUTPUT_DIR}" \
          -exportOptionsPlist "${EXPORT_OPTS}"

        echo "=== Export output ==="
        ls -laR "${OUTPUT_DIR}" || true
      artifact-name: AdGuardMini-${{ inputs.configuration }}
      artifact-path: ${{ needs.resolve-artifact-path.outputs.path }}
      # Standalone/IAP artifacts are directories and get ditto-archived. The
      # TestFlight MAS artifact must stay a flat dir (its .pkg is matched by
      # glob in deploy-to-testflight.yml), so skip the ditto zip for it.
      artifact-archive: ${{ !(inputs.signing-type == 'appstore' && inputs.app-store-info == true) }}
      notarize: ${{ inputs.notarize }}
      sentry-project: adguard-mac-mini
      sentry-debug-files-path: ${{ needs.resolve-artifact-path.outputs.archive-path }}/dSYMs/
      release: ${{ inputs.sentry-release }}
