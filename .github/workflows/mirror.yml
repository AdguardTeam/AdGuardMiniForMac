# Mirrors master, release/* branches and all tags to the public repository AdguardTeam/AdGuardMiniForMac.

name: Mirror

on:
  push:
    branches:
      - master
      - release/*
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  mirror:
    if: github.repository_owner == 'AdGuardSoftwareLimited'
    uses: AdGuardSoftwareLimited/actions/.github/workflows/mirror.yml@master
    with:
      team: mac
      target_repo: git@github.com:AdguardTeam/AdGuardMiniForMac.git
      # Only the branches/tags that trigger this workflow (and the release branches) are mirrored
      refspecs: '+refs/heads/master:refs/heads/master +refs/heads/release/*:refs/heads/release/* +refs/tags/*:refs/tags/*'
