syntax = "proto3";

import "PrimitivesWrappers.proto";
import "Telemetry.proto";

/* Service that handles telemetry events */
service TelemetryService {
    /* Record telemetry event */
    rpc RecordEvent(TelemetryEvent) returns (EmptyValue);
    /* Get active AB tests */
    rpc GetActiveABTests(EmptyValue) returns (ActiveABTests);
}
