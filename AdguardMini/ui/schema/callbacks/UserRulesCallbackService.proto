syntax = "proto3";

import "UserRules.proto";
import "PrimitivesWrappers.proto";

/* Service handles settings lists */
service UserRulesCallbackService {
    /* Fires when user rules were updated through assistant */
    rpc onUserFilterChange(UserRulesCallbackState) returns (EmptyValue);
    /* Fires when the user-rules editor window was closed */
    rpc onUserRulesWindowClosed(EmptyValue) returns (EmptyValue);
}
