syntax = "proto3";

option optimize_for = CODE_SIZE;

// Describes window geometry (position and size, monitor-relative)
message WindowGeometry {
    int32 x = 1;
    int32 y = 2;
    int32 width = 3;
    int32 height = 4;
    int32 monitor = 5;
}

// Describes settings page
message Settings {
    bool launch_on_startup = 1;
    bool show_in_menu_bar = 2;
    bool hardware_acceleration = 3;
    bool auto_filters_update = 4;
    QuitReaction quitReaction = 5;
    bool debug_logging = 6;
    ReleaseVariants release_variant = 7;
    repeated int32 consent_filters_ids = 8;
    string language = 9;
    bool allow_telemetry = 10;
    Theme theme = 11;
    optional WindowGeometry user_rules_editor_geometry = 12;
    bool show_safari_toolbar_badge = 13;
    bool last_update_more_seven_days = 14;
    bool login_item_enabled = 15;
}

message UserConsent {
    repeated int32 filters_ids = 1;
}

enum ReleaseVariants {
    ReleaseVariants_unknown = 0;
    ReleaseVariants_MAS = 1;
    ReleaseVariants_standAlone = 2;
}

enum ImportMode {
    ImportMode_unknown = 0;
    ImportMode_full = 1;
    ImportMode_withoutAnnoyance = 2;
    ImportMode_cancel = 3;
}

message ImportSettingsConfirmation {
    ImportMode mode = 1;
}

message ImportStatus {
    bool success = 1;
    repeated int32 filters_ids = 2;
}

message GlobalSettings {
    bool enabled = 1;
    bool newVersionAvailable = 3;
    ReleaseVariants releaseVariant = 4;
    string language = 5;
    bool debug_logging = 6;
    bool allow_telemetry = 8;
    Theme theme = 9;
    int64 last_filters_update_timestamp_ms = 10;
    repeated string hidden_stories = 11;
    bool login_item_enabled = 12;
}

message UpdateQuitReactionMessage {
    QuitReaction reaction = 1;
}

enum QuitReaction {
    QuitReaction_unknown = 0;
    QuitReaction_ask = 1;
    QuitReaction_quit = 2;
    QuitReaction_keepRunning = 3;
}

message UpdateThemeMessage {
    Theme theme = 1;
}

enum Theme {
    Theme_unknown = 0;
    Theme_system = 1;
    Theme_light = 2;
    Theme_dark = 3;
}
