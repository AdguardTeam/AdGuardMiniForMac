version = 1
SPDX-PackageName = "AdGuard Mini"
SPDX-PackageSupplier = "AdGuard Software Limited <devteam@adguard.com>"
SPDX-PackageDownloadLocation = "https://github.com/AdguardTeam/AdguardForSafari"

[[annotations]]
path = ["**/*.png", "**/*.svg", "**/*.pdf", "**/*.xcassets/**/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Media Kit"

[[annotations]]
path = ["**/locales/*.json", "**/*.strings", "**/*.stringsdict"]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Translations"

[[annotations]]
path = ["AdguardMini/SciterResources/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Generated Protobuf Swift schema + built WKWebView UI bundle (historically hosted the Sciter runtime resources; later migrated to WKWebView)"

[[annotations]]
path = [
    "**/*.json",
    "**/*.xcconfig",
    "**/*.pbxproj",
    "**/*.xcscheme",
    "**/*.xcworkspace/**",
    "**/*.xcodeproj/**",
    "**/*.entitlements",
    "**/*.plist",
    "**/.dockerignore",
    "**/.eslintignore",
    "**/.nvmrc",
    "**/Package.swift",
    "requirements.txt",
    "**/README.md",
    "DEVELOPMENT.md",
    ".localecheckerrc",
    ".lintstagedrc.js",
    ".husky/**",
    "**/*.html",
    "AdguardMini/ui/modules/inline/**",
    "AdguardMini/AdguardMini/Resources/ThirdPartyDependencies.md",
    "docs/safari-filters-update-flow.md",
    "AdguardMini/AdguardMiniTests/UrlFilteringCheckerTests/Filter1.txt",
    "AdguardMini/WebExtension/Resources/**",
    "AdguardMini/PopupExtension/ContentScript/rollup.config.ts",
    "AdguardMini/PopupExtension/ContentScript/src/index.ts",
    "AdguardMini/PopupExtension/ContentScript/src/logger.ts",
    "**/*.xcdatamodeld/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
    "sciter-adguard-mini-private-template/**",
    "Support/XcodeTemplates/**",
    ".github/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [".windsurf/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
    "AdguardMini/ui/schema/**/*.proto"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Protocol Buffers schema definitions"

[[annotations]]
path = [
    "AdguardMini/MiniResources/ProtoSchema/Sources/**/*.swift"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Generated from proto schemas"

[[annotations]]
path = [
    "AdguardMini/ui/modules/common/apis/types/**/*.ts",
    "AdguardMini/ui/modules/common/apis/requests/**/*.ts",
    "AdguardMini/ui/modules/common/apis/callbacks/**/*.ts"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Generated from proto schemas"

[[annotations]]
path = [
    "build/**",
    "*.xcworkspace/**",
    "*.xcodeproj/**",
    "DerivedData/**",
    "**/*.resolved",
    "**/*.lock",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "Dependency files"

[[annotations]]
path = [
    "AdguardMini/ui/packages/proto-generator/**",
]
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Internal proto codegen tool, sample fixtures and generated cache"

[[annotations]]
path = [
    "AdguardMini/ui/packages/webview-utils-kit/**",
]
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Vendored third-party TypeScript type declarations"

[[annotations]]
path = [
    "AdguardMini/ui/tests/codegen/fixtures/**",
]
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Codegen test fixtures"

[[annotations]]
path = [
    "docs/security-hardening-summary.md",
    "main",
]
SPDX-FileCopyrightText = "AdGuard Software Limited"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Build artifacts and documentation"
